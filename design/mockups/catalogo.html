<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo — Mini Galú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .cat-band { padding-bottom: 22px; margin-bottom: 8px; }
  .cat-band .tabs { border-bottom: 0; } /* la costura de la franja ya hace de línea */
  .cat-hero { padding: clamp(36px, 6vw, 88px) 0 24px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 16px 24px; }
  .cat-hero h1 { margin-top: 14px; }
  .cat-hero .hand { font-size: 30px; transform: rotate(-4deg); display: inline-block; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1.5px dashed var(--line-2); position: relative; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
  .tabs button { padding: 14px 16px; font: 500 15px/1 var(--f-ui); white-space: nowrap; color: var(--cacao-2); transition: color var(--t-fast); flex: none; }
  .tabs button[aria-selected="true"] { color: var(--cacao); font-weight: 700; }
  .tabs .ink { position: absolute; bottom: -1.5px; left: 0; height: 2.5px; background: var(--canela); border-radius: 2px; transition: transform var(--t-med) var(--ease), width var(--t-med) var(--ease); }

  .toolbar { position: sticky; top: var(--header-h); z-index: 30; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .toolbar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 12px; }
  .search { flex: 1; min-width: 0; max-width: 440px; position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--cacao-2); pointer-events: none; }
  .search input { width: 100%; height: 46px; border-radius: var(--r-pill); border: 0; background: var(--linen); padding: 0 18px 0 46px; outline: none; font-size: 15px; }
  .search input:focus { box-shadow: inset 0 0 0 1.5px var(--canela); }
  .seg { display: inline-flex; padding: 4px; border-radius: var(--r-pill); background: var(--linen); position: relative; flex: none; }
  .seg button { position: relative; z-index: 1; height: 38px; padding: 0 16px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; transition: color var(--t-med); }
  .seg button[aria-pressed="true"] { color: var(--paper); }
  .seg .knob { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: var(--r-pill); background: var(--cacao); transition: transform var(--t-med) var(--ease-spring), width var(--t-med) var(--ease); }
  .sort { height: 46px; width: auto; border-radius: var(--r-pill); padding-left: 16px; font-size: 14px; flex: none; background-color: transparent; }
  .count { margin-left: auto; font-size: 13px; color: var(--cacao-2); white-space: nowrap; }
  .filters-btn { display: none; position: relative; }
  .filters-btn .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--canela); color: #fff; font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px; }
  .filters-btn .n:empty { display: none; }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: clamp(24px, 3.4vw, 56px); padding-block: 24px 80px; align-items: start; }
  .filters { position: relative; display: grid; gap: 26px; }
  .filters-head, .filters-foot { display: none; }
  .filters h4 { margin: 0 0 12px; font: 600 11.5px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--cacao-2); display: flex; justify-content: space-between; }
  .filters h4 span { letter-spacing: 0; text-transform: none; color: var(--cacao); font-size: 13px; }
  .filters .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters .chip { height: 36px; padding: 0 14px; }
  .sw-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); position: relative; transition: transform var(--t-fast) var(--ease-spring); }
  .sw:hover { transform: scale(1.12); }
  .sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px dashed var(--cacao); }
  .nena { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--rosa-l); cursor: pointer; transition: box-shadow var(--t-fast); width: 100%; text-align: left; }
  .nena:hover { box-shadow: inset 0 0 0 1.5px var(--rosa); }
  .nena[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--cacao); }
  .nena .av { width: 38px; height: 38px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font: italic 400 20px/1 var(--f-display); color: var(--rojo); flex: none; }
  .nena small { display: block; font-size: 12px; color: var(--cacao-2); }
  input[type=range] { width: 100%; accent-color: var(--canela); }

  .active-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .active-row:empty { display: none; }
  .active-row .chip { height: 32px; font-size: 12.5px; background: var(--linen); box-shadow: none; padding: 0 10px 0 14px; }
  .active-row .chip svg { width: 14px; height: 14px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(28px, 3vw, 44px) clamp(14px, 2vw, 28px); }
  @media (min-width: 1800px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 2400px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  .grid .p-card { view-transition-class: card; }
  ::view-transition-group(*.card) { animation-duration: .5s; animation-timing-function: var(--ease); }
  .promo-tile { border-radius: var(--r-md); background: var(--cacao); color: var(--linen); padding: clamp(20px, 2vw, 28px); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; aspect-ratio: 3/4; position: relative; overflow: hidden; }
  .promo-tile .display { font-size: clamp(24px, 2.2vw, 34px); margin: 0 0 18px; }
  .promo-tile .display em { color: var(--rosa); }
  .promo-tile .big-bow { position: absolute; right: -40px; top: -20px; width: 220px; color: rgba(232,198,191,.14); transform: rotate(-14deg); }
  .empty { grid-column: 1 / -1; }
  /* modo lista de cumple */
  .pick-head { background: var(--rosa-l); border-bottom: 1.5px dashed color-mix(in srgb, var(--canela) 35%, transparent); }
  .pick-head .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex-wrap: wrap; }
  .pick-head b { display: block; font: 400 20px/1.2 var(--f-display); }
  .pick-head b em { color: var(--canela); }
  .pick-head small { color: var(--cacao-2); font-size: 13px; }
  .pick-head .link { margin-left: auto; font-size: 13.5px; }
  .pick-ic { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; color: var(--canela); flex: none; }
  .pickable { cursor: pointer; }
  .pickable .p-frame { transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease-spring); }
  .pickable.is-picked .p-frame { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--canela); transform: scale(.97); }
  .pick-btn { position: absolute; left: 12px; bottom: 12px; z-index: 4; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 90%, transparent); color: transparent; box-shadow: inset 0 0 0 1.5px var(--cacao-3); transition: all var(--t-med) var(--ease-spring); }
  .pick-btn[aria-pressed="true"] { background: var(--canela); color: var(--paper); box-shadow: none; transform: scale(1.08); }
  .pick-size { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 12px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--paper) 92%, transparent); font-size: 12px; font-weight: 600; }
  .pick-size select { border: 0; background: var(--linen); border-radius: var(--r-pill); padding: 5px 8px; font: 600 13px var(--f-ui); cursor: pointer; }
  .pick-in { position: absolute; left: 12px; bottom: 12px; z-index: 4; display: inline-flex; gap: 6px; align-items: center; padding: 7px 12px; border-radius: var(--r-pill); background: var(--salvia-l); color: var(--salvia-d); font-size: 12.5px; font-weight: 600; }
  .in-list { cursor: default; } .in-list .p-media img { filter: saturate(.6); opacity: .8; }
  .pick-mode .p-quick, .pick-mode .quick-toggle { display: none !important; }
  .pick-bar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 72; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 12px; border-radius: var(--r-pill); background: var(--cacao); color: var(--linen); box-shadow: var(--shadow-lift); max-width: calc(100vw - 24px); font-size: 14px; white-space: nowrap; }
  .pick-bar .btn { min-height: 46px; --fill: var(--canela); --fg-h: var(--paper); } /* al pasar el mouse: canela, para que no se pierda contra el fondo marrón */
  .pick-thumbs { display: flex; }
  .pick-thumbs:empty { display: none; }
  .pick-thumbs img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--cacao); margin-left: -10px; animation: bump .4s var(--ease-spring); }
  .pick-thumbs img:first-child { margin-left: 0; }
  .pick-mode .galu-fab, .pick-mode .contact-rail { display: none; }
  @media (max-width: 600px) { .pick-bar { left: 12px; right: 12px; transform: none; justify-content: space-between; } .pick-bar #pick-n { display: none; } .pick-head .link { margin-left: 56px; } .pick-size { right: 8px; bottom: 8px; padding-left: 8px; } .pick-btn { left: 8px; bottom: 8px; width: 34px; height: 34px; } }
  /* cierre de la grilla: llena las columnas que quedan libres en la última fila */
  .end-tile { border-radius: var(--r-md); background: var(--linen); padding: clamp(22px, 2.4vw, 36px); display: grid; align-content: center; justify-items: start; gap: 12px; position: relative; overflow: hidden; min-height: 260px; box-shadow: inset 0 0 0 1.5px var(--linen-2); }
  .end-tile::after { content: ""; position: absolute; inset: 10px; border-radius: calc(var(--r-md) - 6px); border: 1.5px dashed color-mix(in srgb, var(--canela) 35%, transparent); pointer-events: none; }
  .end-tile .emb { position: absolute; right: -18px; bottom: -22px; width: 150px; color: color-mix(in srgb, var(--canela) 30%, transparent); transform: rotate(-12deg); }
  .end-tile .hand { font-size: clamp(28px, 2.4vw, 36px); }
  .end-tile p { margin: 0; max-width: 34ch; color: var(--cacao-2); font-size: 14.5px; }
  .end-tile .row { justify-content: flex-start; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
  .size-tip { margin-top: 6px; padding: 16px; border-radius: var(--r-md); background: var(--linen); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; position: relative; }
  .size-tip > svg { color: var(--canela); margin-top: 2px; }
  .size-tip b { display: block; font: 400 17px/1.2 var(--f-display); margin-bottom: 4px; }
  .size-tip span:not(.hand) { color: var(--cacao-2); display: block; margin-bottom: 8px; }
  .size-tip .link { font-size: 12.5px; }
  .size-tip .hand { grid-column: 1 / -1; justify-self: end; font-size: 22px; transform: rotate(-4deg); margin-top: 2px; }
  @media (max-width: 1000px) { .size-tip { display: none; } }

  .lookbook { columns: 3; column-gap: 18px; }
  @media (min-width: 1800px) { .lookbook { columns: 4; } }
  .lb-item { break-inside: avoid; margin-bottom: 18px; position: relative; border-radius: var(--r-lg); overflow: hidden; display: block; background: var(--linen); }
  .lb-item img { width: 100%; transition: transform 1.4s var(--ease); }
  .lb-item:hover img { transform: scale(1.05); }
  .lb-item::after { content: ""; position: absolute; inset: 12px; z-index: 2; border-radius: inherit; border: 1.5px dashed rgba(251,248,243,0); pointer-events: none; transition: border-color var(--t-med) var(--ease), inset var(--t-med) var(--ease); }
  @media (hover: hover) { .lb-item:hover::after { border-color: rgba(251,248,243,.8); inset: 9px; } }
  .lb-item .cap { position: absolute; inset: auto 0 0 0; padding: 60px 20px 18px; background: linear-gradient(transparent, rgba(40,28,22,.7)); color: var(--paper); display: flex; justify-content: space-between; align-items: end; gap: 10px; }
  .lb-item .cap b { font: italic 400 24px/1.05 var(--f-display); }
  @media (hover: hover) { .lb-item .cap { transform: translateY(20px); opacity: 0; transition: all var(--t-med) var(--ease); } .lb-item:hover .cap { transform: none; opacity: 1; } }
  .lb-item:nth-child(3n+2) { border-radius: var(--arch); }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; padding-top: 12px; }
    .filters { position: fixed; inset: auto 0 0 0; top: auto; z-index: 92; background: var(--paper); padding: 0 var(--gutter); border-radius: 28px 28px 0 0; max-height: 86dvh; box-shadow: var(--shadow-lift); transform: translateY(105%); visibility: hidden; transition: transform .55s var(--ease), visibility 0s .55s; gap: 24px; }
    .filters.is-open { transform: none; visibility: visible; transition: transform .55s var(--ease); }
    .filters-head { display: flex; position: sticky; top: 0; z-index: 2; background: var(--paper); justify-content: space-between; align-items: center; padding: 20px 0 12px; border-bottom: 1.5px dashed var(--line-2); }
    .filters-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; border-radius: 2px; background: var(--linen-3); transform: translateX(-50%); }
    .filters-foot { display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--paper); padding: 14px 0 calc(16px + env(safe-area-inset-bottom)); border-top: 1.5px dashed var(--line-2); }
    .filters-foot .btn { flex: 1; }
    .filters-btn { display: inline-flex; }
    .lookbook { columns: 2; }
  }
  @media (max-width: 1000px) and (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 699px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .toolbar { position: static; }
    .toolbar .wrap { flex-wrap: wrap; }
    .search { flex: 1 1 100%; max-width: none; order: -1; }
    .seg button { padding: 0 12px; }
    .seg button span { display: none; }
    .count { display: none; }
    .sort { margin-left: 0; flex: 1 1 0; min-width: 0; padding-right: 36px; }
    .cat-hero { grid-template-columns: 1fr; }
    .cat-hero .hand { display: none; }
    .promo-tile { aspect-ratio: auto; grid-column: span 2; }
    .promo-tile .big-bow { width: 160px; }
  }
</style>
</head>
<body data-page="catalogo">
<main>
  <div class="cat-band bg-linen hem-bottom"><div class="wrap">
    <div class="cat-hero">
      <div><span class="eyebrow">Tienda y catálogo</span><h1 class="display h1" id="cat-title">Todo el <em>taller</em></h1></div>
      <span class="hand">pocas de cada una ✿</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-col="">Todo</button>
      <button role="tab" data-col="Verano 2027">Verano 2027</button>
      <button role="tab" data-col="Fiestas">Fiestas</button>
      <button role="tab" data-col="Atemporal">Atemporal</button>
      <button role="tab" data-col="Accesorios">Accesorios</button>
      <i class="ink" id="ink"></i>
    </div>
  </div></div>

  <div class="pick-head" id="pick-head" hidden><div class="wrap"><span class="pick-ic"><span data-icon="list-checks"></span></span><div><b>Armando la lista de cumple de <em id="pick-who"></em></b><small id="pick-hint"></small></div><a class="link" href="cuenta.html#lista">Volver a la lista</a></div></div>

  <div class="toolbar" id="buscar">
    <div class="wrap">
      <button class="btn btn-sm btn-ghost filters-btn" id="filters-btn"><span data-icon="sliders-horizontal" class="i-sm"></span> Filtros <span class="n" id="f-count"></span></button>
      <label class="search"><span data-icon="search" class="i-sm"></span><input id="q" type="search" placeholder="Buscá “vestido rojo”, “plumeti”, “bautismo”…" aria-label="Buscar"></label>
      <div class="seg" role="group" aria-label="Vista"><i class="knob" id="knob"></i>
        <button aria-pressed="true" data-view="shop" aria-label="Vista tienda"><i data-lucide="layout-grid" class="i-sm"></i><span>Tienda</span></button>
        <button aria-pressed="false" data-view="lookbook" aria-label="Vista lookbook"><i data-lucide="image" class="i-sm"></i><span>Lookbook</span></button>
      </div>
      <select class="input sort" id="sort" aria-label="Ordenar">
        <option value="new">Más nuevos</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="pop">Más vendidos</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="wrap layout">
    <aside class="filters" id="filters" aria-label="Filtros">
      <div class="filters-head"><b class="display" style="font-size:24px">Filtros</b><button class="icon-btn" id="filters-x" aria-label="Cerrar filtros"><span data-icon="x"></span></button></div>
      <div id="f-nenas-box">
        <h4>Para mis nenas</h4>
        <div style="display:grid;gap:8px" id="f-nenas"></div>
      </div>
      <div><h4>Talle</h4><div class="chips" id="f-size"></div></div>
      <div><h4>Ocasión</h4><div class="chips" id="f-occ"></div></div>
      <div><h4>Color</h4><div class="sw-row" id="f-color"></div></div>
      <div><h4>Precio hasta <span id="pmax"></span></h4><input type="range" id="price" min="2500" max="47000" step="500" value="47000" aria-label="Precio máximo"></div>
      <label class="switch">Solo con stock <input class="tog" type="checkbox" id="instock" checked></label>
      <button class="link" data-clear style="justify-self:start">Limpiar filtros</button>
      <div class="size-tip"><span data-icon="ruler"></span><div><b>¿Entre dos talles?</b><span>Elegí el más grande: los modelos tienen 3 cm de holgura para que duren más.</span><a class="link" href="producto.html?p=cleo#medidas">Ver la tabla</a></div><span class="hand">¡crecen rapidísimo!</span></div>
      <div class="filters-foot"><button class="btn btn-ghost" data-clear>Limpiar</button><button class="btn" id="filters-apply">Ver prendas</button></div>
    </aside>
    <div class="pick-bar" id="pick-bar" hidden><div class="pick-thumbs" id="pick-thumbs"></div><span id="pick-n"></span><button class="btn btn-rose" id="pick-go" disabled><span data-icon="plus" class="i-sm"></span> <span>Agregar a la lista de <span id="pick-who2"></span></span></button></div>
    <div class="scrim" id="f-scrim" style="z-index:91"></div>

    <section aria-live="polite">
      <div class="active-row" id="active"></div>
      <div class="grid" id="grid"></div>
      <div class="lookbook" id="lookbook" hidden></div>
    </section>
  </div>
</main>

<script src="assets/vendor/lucide.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("mg:ready", () => {
  const { products, card, money, img, BOW, EMB, icon } = MG;
  const $ = (s) => document.querySelector(s);
  const params = MG.params;
  const MAXP = 47000;
  const state = { col: params.get("col") || "", sizes: new Set(), occ: new Set(), colors: new Set(), max: MAXP, instock: true, q: "", sort: "new", view: params.get("view") || "shop", nena: null };
  if (!["", "Verano 2027", "Fiestas", "Atemporal", "Accesorios"].includes(state.col)) state.col = "";
  // atajos que llegan desde el menú: ?talle=6, ?ocasion=bautismo, ?q=vestido rojo
  if (params.get("talle")) state.sizes.add(params.get("talle"));
  // modo lista de cumple: ?lista=Emma → se eligen prendas tocándolas y se suman todas juntas
  const listFor = MG.auth.logged() ? MG.nenas.all().find(([n]) => n === params.get("lista")) : null;
  const picked = new Map(); // slug → talle
  if (params.get("ocasion")) state.occ.add(params.get("ocasion"));
  if (params.get("q")) {
    const q = params.get("q"), m = q.match(/talle\s*(\d+|12\s*m)/i);
    if (m) state.sizes.add(m[1].replace(/\s/g, ""));
    state.q = q.replace(/talle\s*(\d+|12\s*m)/i, "").trim();
  }

  const SIZES = ["12m", "2", "4", "6", "8", "10"];
  // nenas de la cuenta (solo con sesión)
  const myNenas = MG.auth.logged() ? MG.nenas.all() : [];
  $("#f-nenas-box").hidden = !myNenas.length;
  $("#f-nenas").innerHTML = myNenas.map(([n, a, t]) => `<button class="nena" data-nena="${t}" aria-pressed="false"><span class="av">${n[0]}</span><span><b>${n}</b><small>${a} ${a === 1 ? "año" : "años"} · talle ${t}</small></span></button>`).join("");
  const OCC = { diario: "Día a día", cumple: "Cumple", fiesta: "Fiesta", bautismo: "Bautismo", navidad: "Navidad", casamiento: "Casamiento" };
  const COLORS = [...new Map(products.map((p) => [p.color[0], p.color[1]]))];
  $("#f-size").innerHTML = SIZES.map((s) => `<button class="chip" data-size-f="${s}" aria-pressed="false">${s}</button>`).join("");
  $("#f-occ").innerHTML = Object.entries(OCC).map(([k, v]) => `<button class="chip" data-occ="${k}" aria-pressed="false">${v}</button>`).join("");
  $("#f-color").innerHTML = COLORS.map(([name, hex]) => `<button class="sw" style="background:${hex}" data-color="${name}" aria-pressed="false" title="${name}" aria-label="${name}"></button>`).join("");

  const sync = () => {
    document.querySelectorAll("[data-size-f]").forEach((b) => b.setAttribute("aria-pressed", state.sizes.has(b.dataset.sizeF)));
    document.querySelectorAll("[data-occ]").forEach((b) => b.setAttribute("aria-pressed", state.occ.has(b.dataset.occ)));
    document.querySelectorAll("[data-color]").forEach((b) => b.setAttribute("aria-pressed", state.colors.has(b.dataset.color)));
    document.querySelectorAll(".nena").forEach((b) => b.setAttribute("aria-pressed", state.nena === b.dataset.nena));
    $("#price").value = state.max; $("#pmax").textContent = money(state.max);
    $("#instock").checked = state.instock;
  };

  function filtered() {
    const q = state.q.trim().toLowerCase();
    const list = products.filter((p) =>
      (!state.col || p.col === state.col) &&
      (!state.sizes.size || [...state.sizes].some((s) => p.sizes[s] > 0)) &&
      (!state.occ.size || p.occ.some((o) => state.occ.has(o))) &&
      (!state.colors.size || state.colors.has(p.color[0])) &&
      p.price <= state.max &&
      (!state.instock || MG.stockOf(p) > 0) &&
      (!q || `${p.name} ${p.desc} ${p.fabric} ${p.color[0]} ${p.occ.join(" ")} ${p.col}`.toLowerCase().includes(q)));
    const sorters = { asc: (a, b) => a.price - b.price, desc: (a, b) => b.price - a.price, pop: (a, b) => b.sold30 - a.sold30, new: () => 0 };
    return list.sort(sorters[state.sort]);
  }

  function activeChips() {
    const out = [];
    state.sizes.forEach((s) => out.push([`Talle ${s}`, "size", s]));
    state.occ.forEach((o) => out.push([OCC[o], "occ", o]));
    state.colors.forEach((c) => out.push([c, "color", c]));
    if (state.max < MAXP) out.push([`Hasta ${money(state.max)}`, "max", ""]);
    if (state.q) out.push([`“${state.q}”`, "q", ""]);
    $("#active").innerHTML = out.map(([l, k, v]) => `<button class="chip" data-rm-f="${k}" data-v="${v}">${l} ${icon("x")}</button>`).join("") + (out.length > 1 ? `<button class="link" data-clear style="font-size:13px">Limpiar todo</button>` : "");
    $("#f-count").textContent = state.sizes.size + state.occ.size + state.colors.size + (state.max < MAXP ? 1 : 0) || "";
  }

  let first = true;
  // ---- modo lista: cada tarjeta se puede elegir; abajo una barra con el total y "Agregar a la lista"
  function markPick() {
    const have = new Set(MG.wishes.of(listFor[0]).map(([s]) => s));
    document.querySelectorAll("#grid .p-card").forEach((c) => {
      const slug = c.querySelector("[data-fav]").dataset.fav, p = MG.bySlug[slug];
      const sz = Object.keys(p.sizes), pre = sz.includes(String(listFor[2])) ? String(listFor[2]) : sz[0];
      c.classList.add("pickable"); c.classList.toggle("is-picked", picked.has(slug)); c.classList.toggle("in-list", have.has(slug));
      c.querySelector(".p-frame").insertAdjacentHTML("beforeend", have.has(slug)
        ? `<span class="pick-in">${icon("check", "i-sm")} Ya está en la lista</span>`
        : `<button class="pick-btn" data-pick="${slug}" aria-pressed="${picked.has(slug)}" aria-label="Elegir ${p.name}">${icon("check", "i-sm")}</button>
           <label class="pick-size">Talle <select data-pick-size="${slug}">${sz.map((t) => `<option ${t === (picked.get(slug) || pre) ? "selected" : ""}>${t}</option>`).join("")}</select></label>`);
    });
    MG.drawIcons(); pickBar();
  }
  function pickBar() {
    const n = picked.size;
    $("#pick-n").textContent = n ? `${n} ${n === 1 ? "prenda elegida" : "prendas elegidas"}` : "Tocá las prendas que le gustan";
    $("#pick-thumbs").innerHTML = [...picked.keys()].slice(0, 5).map((s) => `<img src="${img(MG.bySlug[s])}" alt="">`).join("");
    $("#pick-go").disabled = !n;
  }
  function render(animate = true) {
    const run = () => {
      const list = filtered();
      const n = list.length;
      $("#count").textContent = `${n} ${n === 1 ? "prenda" : "prendas"}`;
      $("#filters-apply").textContent = n ? `Ver ${n} ${n === 1 ? "prenda" : "prendas"}` : "Sin resultados";
      const cards = list.map((p, i) => card(p, { i, reveal: first }).replace("<article", `<article style="view-transition-name:c-${p.slug}"`));
      if (cards.length > 4 && !listFor) cards.splice(4, 0, `<div class="promo-tile" style="view-transition-name:promo"><div class="big-bow">${BOW}</div><span class="eyebrow" style="color:var(--rosa)">¿No sabés el talle?</span><div><p class="display">Decile la edad a <em>Galú</em> y te muestra lo que le queda.</p><button class="btn btn-rose btn-sm" data-open-galu>${icon("message-circle-heart", "i-sm")} Preguntarle</button></div></div>`);
      $("#grid").innerHTML = cards.length ? cards.join("") : `<div class="empty empty-state">${EMB}<div class="hand" style="font-size:36px">Nada por acá…</div><p class="muted" style="max-width:40ch;margin:0 0 8px">Probá con otro talle o preguntale a Galú: te avisamos cuando vuelva lo que buscás.</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-clear>Limpiar filtros</button><button class="btn btn-ghost" data-open-galu>Preguntarle a Galú</button></div></div>`;
      $("#lookbook").innerHTML = !list.length ? `<div class="empty-state" style="column-span:all">${EMB}<div class="hand" style="font-size:36px">Nada por acá…</div><button class="btn" data-clear>Limpiar filtros</button></div>` : list.flatMap((p) => p.photos.slice(0, 2).map((_, k) => `<a class="lb-item" href="producto.html?p=${p.slug}" data-vt><img src="${img(p, k + 1)}" alt="${p.name}" loading="lazy"><div class="cap"><b>${p.name}</b><span>${money(p.price)}</span></div></a>`)).join("");
      if (cards.length && !listFor) endTile();
      if (listFor) markPick();
      $("#grid").hidden = state.view !== "shop";
      fitEnd();
      $("#lookbook").hidden = state.view === "shop";
      $("#cat-title").innerHTML = state.col ? state.col.replace(/(\d{4}|Fiestas|Atemporal|Accesorios)$/, "<em>$1</em>") : "Todo el <em>taller</em>";
      activeChips();
    };
    animate && document.startViewTransition && !document.documentElement.classList.contains("static") ? document.startViewTransition(run).ready.catch(() => {}) : run();
  }

  // Nota del taller al final: ocupa lo que sobra de la última fila (o una fila entera si no sobra nada)
  function endTile() {
    const g = $("#grid");
    g.insertAdjacentHTML("beforeend", `<div class="end-tile"><span class="emb">${EMB}</span><span class="hand">eso es todo… por ahora ♡</span><p>Cada mes salen tandas nuevas y pocas por talle. Anotate y te avisamos antes que en Instagram.</p><div class="row"><button class="btn btn-sm" data-end-notify>${icon("bell-ring", "i-sm")} Avisame de lo nuevo</button><a class="btn btn-sm btn-ghost" href="index.html#lanzamiento">Ver el lanzamiento</a></div></div>`);
    g.lastElementChild.querySelector("[data-end-notify]").addEventListener("click", () => MG.toast("Te avisamos cuando salga la próxima tanda", "bell-ring"));
    fitEnd();
  }
  function fitEnd() {
    const g = $("#grid"), t = g.querySelector(".end-tile");
    if (!t) return;
    t.style.gridColumn = "";
    const cols = getComputedStyle(g).gridTemplateColumns.split(" ").length;
    const first = g.firstElementChild, step = first.getBoundingClientRect().width + parseFloat(getComputedStyle(g).columnGap);
    if (!step) { t.style.gridColumn = "1 / -1"; return; } // grilla oculta (vista lookbook)
    const col = Math.round((t.getBoundingClientRect().left - first.getBoundingClientRect().left) / step);
    t.style.gridColumn = `span ${Math.max(1, cols - col)}`;
  }
  let fitRaf; addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitEnd); });

  function moveInk() {
    const btn = document.querySelector(`#tabs [data-col="${state.col}"]`);
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b === btn));
    $("#ink").style.transform = `translateX(${btn.offsetLeft}px)`; $("#ink").style.width = btn.offsetWidth + "px";
  }
  function moveKnob() {
    const btn = document.querySelector(`[data-view="${state.view}"]`);
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
    $("#knob").style.transform = `translateX(${btn.offsetLeft}px)`; $("#knob").style.width = btn.offsetWidth + "px";
  }
  const sheet = (on) => { $("#filters").classList.toggle("is-open", on); $("#f-scrim").classList.toggle("is-open", on); document.body.classList.toggle("menu-open", on); };
  const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) { if (e.target.id === "f-scrim") sheet(false); return; }
    if (b.dataset.col !== undefined) { state.col = b.dataset.col; moveInk(); render(); }
    else if (b.dataset.view) { state.view = b.dataset.view; moveKnob(); render(); }
    else if (b.dataset.sizeF) { toggle(state.sizes, b.dataset.sizeF); state.nena = null; sync(); render(); }
    else if (b.dataset.occ) { toggle(state.occ, b.dataset.occ); sync(); render(); }
    else if (b.dataset.color) { toggle(state.colors, b.dataset.color); sync(); render(); }
    else if (b.dataset.nena) {
      const on = state.nena !== b.dataset.nena;
      state.nena = on ? b.dataset.nena : null;
      state.sizes = new Set(on ? [b.dataset.nena] : []);
      sync(); render();
    }
    else if (b.dataset.rmF) {
      const k = b.dataset.rmF, v = b.dataset.v;
      if (k === "size") { state.sizes.delete(v); state.nena = null; } else if (k === "occ") state.occ.delete(v); else if (k === "color") state.colors.delete(v); else if (k === "max") state.max = MAXP; else if (k === "q") { state.q = ""; $("#q").value = ""; }
      sync(); render();
    }
    else if (b.matches("[data-clear]")) {
      Object.assign(state, { sizes: new Set(), occ: new Set(), colors: new Set(), max: MAXP, q: "", nena: null, instock: true });
      $("#q").value = ""; sync(); render();
    }
    else if (b.id === "filters-btn") sheet(true);
    else if (b.id === "filters-x" || b.id === "filters-apply") sheet(false);
  });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(false); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#instock").addEventListener("change", (e) => { state.instock = e.target.checked; render(); });
  $("#price").addEventListener("input", (e) => { state.max = +e.target.value; $("#pmax").textContent = money(state.max); render(false); });

  $("#q").value = state.q;
  if (listFor) {
    document.body.classList.add("pick-mode");
    $("#pick-head").hidden = false; $("#pick-bar").hidden = false;
    $("#pick-who").textContent = listFor[0]; $("#pick-who2").textContent = listFor[0];
    $("#pick-hint").textContent = `Talle ${listFor[2]} · cumple el ${listFor[4]}`;
    $("#grid").addEventListener("click", (e) => {
      if (e.target.closest(".pick-size, .fav, .p-quick, .quick-toggle")) return;
      const c = e.target.closest(".p-card.pickable:not(.in-list)"); if (!c) return;
      e.preventDefault();
      const slug = c.querySelector("[data-pick]").dataset.pick;
      picked.has(slug) ? picked.delete(slug) : picked.set(slug, c.querySelector("[data-pick-size]").value);
      c.classList.toggle("is-picked", picked.has(slug)); c.querySelector("[data-pick]").setAttribute("aria-pressed", picked.has(slug));
      pickBar();
    });
    $("#grid").addEventListener("change", (e) => { const s = e.target.closest("[data-pick-size]"); if (s && picked.has(s.dataset.pickSize)) picked.set(s.dataset.pickSize, s.value); });
    $("#pick-go").addEventListener("click", () => {
      let n = 0; picked.forEach((size, slug) => { if (MG.wishes.add(listFor[0], slug, size)) n++; });
      try { sessionStorage.setItem("mg-flash", `Sumamos ${n} ${n === 1 ? "prenda" : "prendas"} a la lista de ${listFor[0]}`); } catch {}
      location.href = "cuenta.html#lista";
    });
  }
  sync(); render(false); first = false; MG.observeReveal($("#grid"));
  const place = () => { moveInk(); moveKnob(); };
  requestAnimationFrame(place);
  addEventListener("resize", place);
  document.fonts?.ready.then(place);
  if (location.hash === "#buscar") setTimeout(() => $("#q").focus(), 400);
});
</script>
</body>
</html>
