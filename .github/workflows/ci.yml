name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: minigalu
          POSTGRES_PASSWORD: minigalu
          POSTGRES_DB: minigalu
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U minigalu" --health-interval 5s --health-timeout 3s --health-retries 10
      # los mails (pago aprobado, gift cards, recuperar contraseña) se mandan y los e2e los leen como en local
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://minigalu:minigalu@localhost:5433/minigalu
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # sucursales fijas: los e2e no dependen de la API de Andreani
      ANDREANI_BRANCHES: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Base de datos (migraciones + seed)
        run: pnpm db:migrate && pnpm db:seed
      - name: Build de la API (el mismo bundle que va a producción; los e2e corren contra él)
        run: pnpm --filter @mini-galu/api build
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E (celular y escritorio)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  docker:
    name: Imagen de la API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: minigalu
          POSTGRES_PASSWORD: minigalu
          POSTGRES_DB: minigalu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minigalu" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build (el mismo Dockerfile que usa Render)
        run: docker build -f apps/api/Dockerfile -t mini-galu-api .
      - name: Arranca en modo producción sobre una base vacía (migra, /health y cuenta del taller)
        run: |
          docker run -d --name api --network host             -e NODE_ENV=production -e PORT=10000             -e DATABASE_URL=postgres://minigalu:minigalu@localhost:5432/minigalu             -e BETTER_AUTH_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci             -e MP_ACCESS_TOKEN=APP_USR-ci -e MP_PUBLIC_KEY=APP_USR-ci -e MP_WEBHOOK_SECRET=ci             -e PUBLIC_API_URL=https://api.minigalu.com.ar -e WEB_ORIGIN=https://minigalu.com.ar             -e COOKIE_DOMAIN=minigalu.com.ar -e RESEND_API_KEY=re_ci             -e S3_ENDPOINT=https://ci.r2.cloudflarestorage.com -e S3_BUCKET=fotos -e S3_ACCESS_KEY_ID=ci             -e S3_SECRET_ACCESS_KEY=ci -e MEDIA_PUBLIC_URL=https://fotos.minigalu.com.ar             -e ADMIN_EMAIL=taller@minigalu.com.ar -e ADMIN_PASSWORD=Taller.MiniGalu1             mini-galu-api
          for i in $(seq 1 30); do curl -sf localhost:10000/health && break; sleep 1; done
          curl -sf localhost:10000/health
          curl -sf -o /dev/null localhost:10000/catalog/products
          docker exec api node dist/admin.js
      - if: failure()
        run: docker logs api
